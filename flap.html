.logo i{width:36px;height:36px;border-radius:50%;background-color:#FABB05;background-image:radial-gradient(circle at 19.7px 9.9px,#EA4A3B 3.4px,transparent 3.5px);-webkit-mask-image:radial-gradient(circle at 30.2px 8.9px,transparent 18px,#000 18.1px),radial-gradient(circle at 22.8px -8.8px,#000 29.7px,transparent 29.8px);mask-image:radial-gradient(circle at 30.2px 8.9px,transparent 18px,#000 18.1px),radial-gradient(circle at 22.8px -8.8px,#000 29.7px,transparent 29.8px);flex-shrink:0}

#hud{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:10;display:flex;gap:6px}
.btn{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:#fff;height:40px;padding:0 13px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;white-space:nowrap}

.dd{position:relative}#hud2{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:10;display:flex;gap:6px}.dotbtn{width:40px;padding:0;justify-content:center}.dotbtn i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:block}.menu>div.sw{display:grid;grid-template-columns:repeat(4,32px);gap:8px;padding:10px}#ddColor .menu{min-width:0}.dot{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#000;font-size:15px;font-weight:800}.dot.sel{border-color:#f7b733;box-shadow:0 0 0 2px #f7b733}
.menu{display:none;position:absolute;right:0;top:100%;padding-top:6px;min-width:176px}

@media(hover:hover){.dd:hover .menu{display:block}}

<div id="hud">
 <div class="dd" id="ddMap"><button class="btn"><span class="ic">🗺️</span><span id="lMap">Day</span> ▾</button><div class="menu"><div id="mMap"></div></div></div>

</div>

 <button class="btn" id="bShare">📤 Share</button>
 <button class="btn" id="bKids">🧸 Kids Mode</button>
</div>
<div id="toast"></div>
<canvas id="c"></canvas>
<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const VW=360,VH=640,GY=VH-40;
const ls={g:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let scale=1,vw=VW;
function resize(){const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;cv.width=Math.floor(w*d);cv.height=Math.floor(h*d);scale=h*d/VH;vw=w*d/scale}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,100));resize();

/* ---------- Sound ---------- */
const snd={c:null,init(){if(!this.c){const A=window.AudioContext||window.webkitAudioContext;if(A)this.c=new A()}if(this.c&&this.c.state==='suspended')this.c.resume()},
 t(f,d,ty,v,to,dl=0){if(!this.c)return;const n=this.c.currentTime+dl,o=this.c.createOscillator(),g=this.c.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.01,n+d);o.connect(g);g.connect(this.c.destination);o.start(n);o.stop(n+d)},
 jump(){this.t(420,.09,'sine',.25,840)},score(){this.t(523,.1,'triangle',.2);this.t(659,.14,'triangle',.2,0,.08)},hit(){this.t(220,.25,'sawtooth',.35,40)},
 unlock(){[523,659,784,1047].forEach((f,i)=>this.t(f,.16,'triangle',.22,0,i*.09))}};

/* ---------- Maps ---------- */
const PD=['#55a823','#86e33c','#2d6011','#1b3f09'],GD=['#ded895','#73cd30','#53a021','#c2ba6d'];
const DAY={top:'#4ec0ca',bot:'#b4e5e7',cloud:'rgba(255,255,255,.85)',sun:'#FFF700',city:'#9ee3b2'};
const NIGHT={top:'#0b1030',bot:'#1c2a52',cloud:'rgba(255,255,255,.12)',sun:'#FFFFE0',moon:1,stars:1,city:'#141c38'};
const MAPS={
 day:{name:'Day',ic:'☀️',ph:[DAY],pipe:PD,ground:GD},
 night:{name:'Night',ic:'🌙',ph:[NIGHT],pipe:['#2f5d7a','#4fa3c9','#173a4d','#0d2230'],ground:['#2b2f46','#3a3f66','#242840','#1c1f33']},
 xmas:{name:'Christmas',ic:'❄️',snow:1,ph:[{top:'#8fb8d8',bot:'#e6f2f8',cloud:'rgba(255,255,255,.9)',sun:'#FFF4B0',city:'#b9d3e4'}],pipe:['#3a7d5a','#6fbf8f','#1f4a34','#12301f'],ground:['#eef4f8','#ffffff','#d7e8f2','#c5d8e4']},
 h24:{name:'24h',ic:'🕛',stretch:28,by:'score',pipe:PD,ground:GD,ph:[
  {top:'#38a1db',bot:'#a1e4f7',cloud:'rgba(255,255,255,.85)',sun:'#FFF700',city:'#529683'},
  {top:'#2c1654',bot:'#f86b4f',cloud:'rgba(255,180,150,.6)',sun:'#FF4500',city:'#422442'},
  {top:'#050b14',bot:'#101f38',cloud:'rgba(200,220,255,.2)',sun:'#FFFFE0',moon:1,stars:1,city:'#0a121e'},
  {top:'#684a86',bot:'#ffaa75',cloud:'rgba(255,230,210,.7)',sun:'#FFD700',city:'#453556'}]},
 cycle:{name:'Sky Cycle',ic:'🌗',stretch:10,lanes:1,by:'time',pipe:PD,ground:GD,ph:[DAY,NIGHT]},
 ufo:{name:'UFO',ic:'🛸',ufo:1,pipe:['#2a0f5c','#00e5ff','#ff2e97','#12062e'],ground:['#1a0b3d','#2a0f5c','#00e5ff','#120730'],ph:[{top:'#07041a',bot:'#2a1160',cloud:'',stars:1,city:'#1b1040'}]}
};
let mapId=ls.g('kf_map','day');if(!MAPS[mapId])mapId='day';let M=MAPS[mapId],sky=null;

/* ---------- Skins ---------- */
const SK=[
 {id:'cute',name:'Cute',body:'#f7d154',belly:'#fff',beak:'#e67e22',wing:'#f7d154',ol:'rgba(0,0,0,.15)',ow:1.5,sh:'cute',u:0},
 {id:'cool',name:'Cool',body:'#f7d328',belly:'#fff',beak:'#f75a28',wing:'#f1b71c',ol:'#000',ow:1.1,sh:'cool',u:0},
 {id:'kai',name:'Kai',body:'#f7d154',belly:'#fff',beak:'#e67e22',wing:'#f39c12',ol:'#d6a011',ow:2,sh:'kai',u:0},
 {id:'plat',name:'Kai Platinum',body:'#eafcff',belly:'#fff',beak:'#e67e22',wing:'#b8eef5',ol:'#4dd0e1',ow:2,sh:'kai',glow:'#4dd0e1',hat:'p',u:30},
 {id:'dia',name:'Kai Diamond',body:'#d6faff',belly:'#fff',beak:'#e67e22',wing:'#7fe9ff',ol:'#00bcd4',ow:2,sh:'kai',glow:'#00e5ff',hat:'d',u:60}];
let bestN=+ls.g('kf_best_n',0),bestK=+ls.g('kf_best_k',0);
let skinId=ls.g('kf_skin','cute');
const skinOpen=s=>bestN>=s.u;
let skin=SK.find(s=>s.id===skinId&&skinOpen(s))||SK[0];
const COLORS=['','#ff9fb0','#8fd3ff','#9b8cff','#7ee081','#ff8a5b','#ffffff','#555b6e'];let color=ls.g('kf_color','');
const eff=()=>color?{...skin,body:color,wing:color}:skin;

/* ---------- State ---------- */
const MENU=0,PLAY=1,OVER=2;
let state=MENU,score=0,frame=0,playF=0,gX=0,cX=0,overAt=0,kids=ls.g('kf_kids','0')==='1',kidsNext=kids,fx=[];
const bird={x:0,y:VH/2,r:14,vy:0,rot:0,g:.38,jp:-6.8,lives:1,inv:0};
const clouds=[{x:50,y:80,s:.3,z:40},{x:220,y:140,s:.5,z:60},{x:320,y:60,s:.2,z:35}];
const amb=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*VH,r:Math.random()*2+1,s:Math.random()*.6+.2,tw:Math.random()*6.28}));
const lanes=[{x:0,y:315},{x:0,y:405}];
function resetLanes(){lanes[0].x=vw+170;lanes[0].y=315;lanes[1].x=vw+520;lanes[1].y=405}
function burst(x,y,c,n=10){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*4.5,vy:(Math.random()-.5)*4.5,r:Math.random()*3+1,a:1,d:Math.random()*.03+.02,c})}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2200)}
const best=()=>kids?bestK:bestN;

/* ---------- Pipes ---------- */
const pipes={list:[],t:0,w:52,
 get gap(){return kids?165:125},get speed(){return kids?1.5:2.1},get every(){return kids?120:95},
 spawn(){const min=50,max=VH-120-this.gap-min;this.list.push({x:vw+10,top:min+Math.floor(Math.random()*(max-min+1)),ph:Math.random()*6.28,passed:false})},
 geo(p){let top=p.top+(M.stretch||0)*Math.sin(this.t*.025+p.ph),gap=this.gap;
  if(M.lanes&&lanes.some(o=>Math.abs(o.x+12-(p.x+26))<90))gap+=58;
  top=Math.max(30,Math.min(GY-gap-30,top));return[top,gap]},
 update(){if(this.t%this.every===0)this.spawn();
  for(const p of this.list){p.x-=this.speed;
   if(!p.passed&&p.x+this.w<bird.x){p.passed=true;score++;
    if(kids){if(score>bestK){bestK=score;ls.s('kf_best_k',bestK)}}else{if(score>bestN){bestN=score;ls.s('kf_best_n',bestN)}
     SK.forEach(s=>{if(s.u&&score===s.u){toast('🔓 Unlocked skin: '+s.name);snd.unlock();buildMenus()}})}
    snd.score();burst(bird.x,bird.y,'#f1c40f',10)}
   if(bird.inv<=0){const[t,g]=this.geo(p),b=box();
    if(hit(b,{l:p.x,r:p.x+this.w,t:0,b:t})||hit(b,{l:p.x,r:p.x+this.w,t:t+g,b:GY}))handleHit()}}
  if(this.list.length&&this.list[0].x<-this.w)this.list.shift()},
 draw(){for(const p of this.list){const[t,g]=this.geo(p);drawPipe(p.x,0,this.w,t,1);drawPipe(p.x,t+g,this.w,GY-(t+g),0)}}};
const box=()=>({l:bird.x-bird.r+3,r:bird.x+bird.r-3,t:bird.y-bird.r+3,b:bird.y+bird.r-3});
const hit=(a,b)=>!(a.r<b.l||a.l>b.r||a.b<b.t||a.t>b.b);
function drawPipe(x,y,w,h,top){const[c1,c2,c3,c4]=M.pipe,cap=20,o=4;
 let g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c1);g.addColorStop(.3,c2);g.addColorStop(.7,c1);g.addColorStop(1,c3);
 ctx.fillStyle=g;ctx.strokeStyle=c4;ctx.lineWidth=2;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);
 const cy=top?y+h-cap:y;g=ctx.createLinearGradient(x-o,0,x+w+o,0);g.addColorStop(0,c1);g.addColorStop(.3,c2);g.addColorStop(.7,c1);g.addColorStop(1,c3);
 ctx.fillStyle=g;ctx.fillRect(x-o,cy,w+o*2,cap);ctx.strokeRect(x-o,cy,w+o*2,cap);
 if(M.snow){ctx.fillStyle='#fff';ctx.fillRect(x-o,cy-(top?4:-cap),w+o*2,4)}}

/* ---------- Bird ---------- */
function drawBird(x,y,rot,s,al){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=al;
 if(s.sh==='kai'){
 if(s.glow){ctx.save();ctx.shadowColor=s.glow;ctx.shadowBlur=16;ctx.fillStyle=s.glow;ctx.globalAlpha=al*.25;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.restore()}
 const w=Math.sin(frame*.3);ctx.fillStyle=s.body;ctx.strokeStyle=s.ol;ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(-12,2);ctx.quadraticCurveTo(-24,-6+w*6,-28,w*8);ctx.quadraticCurveTo(-24,4+w*6,-12,8);ctx.closePath();ctx.fill();ctx.stroke();
 const ea=bird.vy<0?-.5:.35+Math.min(bird.vy*.02,.4);
 ctx.save();ctx.translate(-4,-10);ctx.rotate(ea+.3);ctx.beginPath();ctx.ellipse(0,0,5,10,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
 ctx.save();ctx.translate(2,-11);ctx.rotate(ea);ctx.beginPath();ctx.ellipse(0,0,5.5,11,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
 ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle=s.belly;ctx.beginPath();ctx.arc(-1,5,7.5,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(9,3,6.5,5,0,0,7);ctx.fill();
 ctx.fillStyle='#3a3a3a';ctx.beginPath();ctx.arc(13.5,2,2,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-5,5.5,0,7);ctx.fill();ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(7,-5,2.6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7.9,-6,.9,0,7);ctx.fill();
 if(s.hat==='p'){ctx.fillStyle='#e0f7fa';ctx.strokeStyle='#4dd0e1';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-8,-13);ctx.lineTo(-4,-22);ctx.lineTo(0,-14);ctx.lineTo(4,-23);ctx.lineTo(8,-13);ctx.closePath();ctx.fill();ctx.stroke()}
 else if(s.hat==='d'){ctx.fillStyle='#b2ebf2';ctx.strokeStyle='#00bcd4';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-9,-13);ctx.lineTo(-5,-24);ctx.lineTo(0,-15);ctx.lineTo(5,-24);ctx.lineTo(9,-13);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(2.5,-16);ctx.lineTo(0,-13);ctx.lineTo(-2.5,-16);ctx.closePath();ctx.fill()}
 ctx.restore();return}
const cool=s.sh==='cool',rx=cool?16:14,ry=cool?13:14;
 if(s.glow){ctx.shadowColor=s.glow;ctx.shadowBlur=14}
 ctx.fillStyle=s.body;ctx.strokeStyle=s.ol;ctx.lineWidth=s.ow;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
 if(!cool){ctx.fillStyle=s.belly;ctx.beginPath();ctx.ellipse(-2,4,7,6,0,0,7);ctx.fill()}
 const wa=Math.sin(frame*(state===PLAY?.5:.3))*.8-.1;
 ctx.save();ctx.translate(-4,2);ctx.rotate(wa);ctx.fillStyle=s.wing;ctx.lineWidth=Math.min(s.ow,1.2);
 ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-10,-2,-11,6);ctx.quadraticCurveTo(-6,9,0,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-5,5.5,0,7);ctx.fill();if(cool){ctx.lineWidth=1;ctx.stroke()}
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(7.5,-5,2.3,0,7);ctx.fill();
 ctx.fillStyle=s.beak;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(10,-2);ctx.lineTo(20,2);ctx.lineTo(10,6);ctx.closePath();ctx.fill();ctx.stroke();
 if(s.hat){ctx.fillStyle=s.hat==='p'?'#e8f4f8':'#7ff3ff';ctx.strokeStyle=s.ol;ctx.lineWidth=1.2;ctx.beginPath();
  if(s.hat==='p'){ctx.moveTo(-7,-12);ctx.lineTo(-7,-20);ctx.lineTo(-3.5,-16);ctx.lineTo(0,-22);ctx.lineTo(3.5,-16);ctx.lineTo(7,-20);ctx.lineTo(7,-12)}
  else{ctx.moveTo(0,-25);ctx.lineTo(6,-18);ctx.lineTo(0,-11);ctx.lineTo(-6,-18)}ctx.closePath();ctx.fill();ctx.stroke()}
 ctx.restore()}
function flap(){bird.vy=bird.jp;snd.jump();burst(bird.x-6,bird.y+4,'#fff',6)}

/* ---------- Background ---------- */
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function phIdx(){return M.by==='score'?Math.floor(score/10)%M.ph.length:M.by==='time'?Math.floor(playF/480)%M.ph.length:0}
const BH=[55,85,45,70,105,50,80,95,60,90],BW=45;
function drawSky(){
 const ph=M.ph[phIdx()],tt=[hex(ph.top),hex(ph.bot)];
 if(!sky)sky=tt.map(a=>a.slice());else for(let i=0;i<2;i++)for(let j=0;j<3;j++)sky[i][j]+=(tt[i][j]-sky[i][j])*.04;
 const g=ctx.createLinearGradient(0,0,0,VH),f=a=>'rgb('+a.map(Math.round)+')';
 g.addColorStop(0,f(sky[0]));g.addColorStop(1,f(sky[1]));ctx.fillStyle=g;ctx.fillRect(0,0,vw,VH);
 for(const p of amb){if(ph.stars){ctx.globalAlpha=.5+.5*Math.sin(frame*.03+p.tw);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x*vw,p.y*.7,p.r,0,7);ctx.fill();ctx.globalAlpha=1}
  else if(M.snow){p.y+=p.s;if(p.y>VH)p.y=-4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((p.x+Math.sin(frame*.02+p.tw)*.01)*vw,p.y,p.r,0,7);ctx.fill()}}
 if(ph.sun){ctx.fillStyle=ph.sun;ctx.beginPath();ctx.arc(vw-60,70,ph.moon?18:24,0,7);ctx.fill()}
 for(const c of clouds){c.x-=c.s*(M.ufo?2.2:1);if(c.x<-100)c.x=vw+50;
  if(M.ufo){const z=c.z;ctx.globalAlpha=.8;ctx.fillStyle='#7CFFCB';ctx.beginPath();ctx.ellipse(c.x,c.y,z*.5,z*.15,0,0,7);ctx.fill();ctx.fillStyle='#b8fff0';ctx.beginPath();ctx.arc(c.x,c.y-z*.1,z*.22,Math.PI,0);ctx.fill();
   ctx.fillStyle=Math.sin(frame*.1+z)>0?'#ff2e97':'#00e5ff';for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(c.x+k*z*.25,c.y+z*.04,2,0,7);ctx.fill()}ctx.globalAlpha=1}
  else{ctx.fillStyle=ph.cloud;ctx.beginPath();ctx.arc(c.x,c.y,c.z*.4,0,7);ctx.arc(c.x+c.z*.25,c.y-c.z*.2,c.z*.35,0,7);ctx.arc(c.x+c.z*.5,c.y,c.z*.3,0,7);ctx.fill()}}
 cX+=.25;ctx.fillStyle=ph.city;const k=Math.floor(cX/BW);
 for(let i=-1;i<Math.ceil(vw/BW)+1;i++){const h=BH[((k+i)%BH.length+BH.length)%BH.length];ctx.fillRect(i*BW-(cX%BW),GY-h,BW+1,h)}}
function drawGround(){const[a,b,c,d]=M.ground;if(state===PLAY)gX=(gX+pipes.speed)%16;
 ctx.fillStyle=a;ctx.fillRect(0,GY,vw,40);ctx.fillStyle=b;ctx.fillRect(0,GY,vw,12);ctx.fillStyle=c;ctx.fillRect(0,GY+10,vw,3);
 ctx.strokeStyle=d;ctx.lineWidth=3;for(let x=-gX;x<vw+16;x+=16){ctx.beginPath();ctx.moveTo(x,GY+13);ctx.lineTo(x-8,VH);ctx.stroke()}}

/* ---------- UI ---------- */
const MED=[[200,'CUP','#fff6c8','#f1c40f','#b37d14'],[150,'DIA','#e0f7fa','#00e5ff','#00838f'],[100,'PLAT','#fff','#e0f7fa','#4dd0e1'],[50,'GOLD','#fff200','#f1c40f','#b7950b'],[25,'SILV','#fff','#bdc3c7','#7f8c8d'],[10,'BRZ','#f3a683','#cd6133','#78281f'],[5,'IRON','#b2bec3','#636e72','#2d3436']];
function medal(x,y,r,s){const m=MED.find(m=>s>=m[0]);ctx.save();ctx.translate(x,y);ctx.textAlign='center';ctx.textBaseline='middle';
 if(!m){ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#8a8a8a';ctx.font='bold 12px sans-serif';ctx.fillText('N/A',0,0)}
 else{const g=ctx.createRadialGradient(-r*.3,-r*.3,2,0,0,r);g.addColorStop(0,m[2]);g.addColorStop(.6,m[3]);g.addColorStop(1,m[4]);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.font='900 10px sans-serif';ctx.fillText(m[1],0,1);ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(-r*.35,-r*.35,r*.2,0,7);ctx.fill()}
 ctx.restore()}
function txt(s,x,y,fill,stroke,lw,font){ctx.font=font;ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeText(s,x,y);ctx.fillText(s,x,y)}
function drawUI(){const cx=vw/2;ctx.textAlign='center';ctx.textBaseline='alphabetic';
 if(state===PLAY){txt(score,cx,70,'#fff','#000',4,'900 38px sans-serif');
  if(kids){ctx.font='14px sans-serif';for(let i=0;i<3;i++){ctx.globalAlpha=i<bird.lives?1:.25;ctx.fillStyle='#ff4d6d';ctx.fillText('❤',cx-20+i*20,100)}ctx.globalAlpha=1}}
 else if(state===MENU){ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,0,vw,VH);
  txt('Kome Flap',cx,160,'#f7d154','#000',5,'900 34px sans-serif');txt('Funny Don’t rage!',cx,190,'#fff','#000',4,'bold 16px sans-serif');
  txt('TAP OR PRESS SPACE',cx,390,'#f7d154','#000',4,'bold 16px sans-serif');
  txt(M.name+(kids?' · Kids Mode':''),cx,418,'#fff','#000',3,'bold 13px sans-serif')}
 else{ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,vw,VH);
  const bw=280,bh=210,bx=cx-bw/2,by=145;ctx.fillStyle='#eccc68';ctx.strokeStyle='#57606f';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,16);ctx.fill();ctx.stroke();
  txt('GAME OVER',cx,by+40,'#e74c3c','#fff',3,'900 28px sans-serif');
  ctx.fillStyle='#d1b852';ctx.strokeStyle='#b89f3a';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(bx+16,by+68,72,82,10);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2f3542';ctx.font='bold 12px sans-serif';ctx.fillText('MEDAL',bx+52,by+84);medal(bx+52,by+120,22,score);
  ctx.textAlign='left';ctx.font='bold 16px sans-serif';ctx.fillText('Score: '+score,bx+104,by+95);ctx.fillText('Best: '+best(),bx+104,by+128);
  if(kids){ctx.font='bold 12px sans-serif';ctx.fillText('Kids Mode',bx+104,by+148)}
  ctx.textAlign='center';txt('Tap to Play Again',cx,by+185,'#fff','#000',3,'bold 17px sans-serif')}}

/* ---------- Flow ---------- */
function handleHit(){if(kids&&bird.lives>1){bird.lives--;bird.inv=70;snd.hit();burst(bird.x,bird.y,'#ff6b6b',12);return}gameOver()}
function gameOver(){if(state!==PLAY)return;state=OVER;overAt=performance.now();snd.hit();burst(bird.x,bird.y,'#e74c3c',25)}
function startRun(){kids=kidsNext;state=PLAY;score=0;playF=0;pipes.list=[];pipes.t=0;resetLanes();
 Object.assign(bird,{y:VH/2,vy:0,rot:0,inv:0,lives:kids?3:1,g:kids?.3:.38,jp:kids?-6.3:-6.8});flap()}
function act(){snd.init();if(state===PLAY)flap();else if(state===MENU||performance.now()-overAt>500)startRun()}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();act()}});
addEventListener('pointerdown',e=>{if(e.target.closest('#hud,#hud2'))return;e.preventDefault();act()});

/* ---------- Menus ---------- */
function buildMenus(){
 const mk=(el,items,onPick)=>{el.innerHTML='';items.forEach(it=>{const d=document.createElement('div');d.className='item'+(it.sel?' sel':'')+(it.lock?' lock':'');d.innerHTML='<span>'+it.l+'</span><span>'+(it.r||'')+'</span>';
  d.addEventListener('click',e=>{e.stopPropagation();if(it.lock){toast('Reach '+it.u+' points in normal mode to unlock');return}onPick(it.id);document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open'))});el.appendChild(d)})};
 mk($('mMap'),Object.entries(MAPS).map(([id,m])=>({id,l:m.ic+' '+m.name,sel:id===mapId})),id=>{mapId=id;M=MAPS[id];sky=null;ls.s('kf_map',id);buildMenus()});
 mk($('mSkin'),SK.map(s=>({id:s.id,l:s.name,r:skinOpen(s)?(s.id===skin.id?'✓':''):'🔒 '+s.u,sel:s.id===skin.id,lock:!skinOpen(s),u:s.u})),id=>{skin=SK.find(s=>s.id===id);ls.s('kf_skin',id);buildMenus()});
 $('bKids').classList.toggle('on',kidsNext);
 $('lMap').textContent=M.name;$('lSkin').textContent=skin.name;$('bColor').firstElementChild.style.background=color||skin.body;
 const cm=$('mColor');cm.innerHTML='';
 COLORS.forEach(c=>{const d=document.createElement('div');d.className='dot'+(c===color?' sel':'');d.style.background=c||skin.body;d.title=c?'Color':'Skin default';if(!c)d.textContent='↺';
  d.addEventListener('click',e=>{e.stopPropagation();color=c;ls.s('kf_color',c);buildMenus();document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open'))});cm.appendChild(d)})}
document.querySelectorAll('.dd>.btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const d=b.parentElement,o=d.classList.contains('open');document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open'));if(!o)d.classList.add('open')}));
addEventListener('click',()=>document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open')));
$('bKids').addEventListener('click',()=>{kidsNext=!kidsNext;ls.s('kf_kids',kidsNext?'1':'0');if(state!==PLAY)kids=kidsNext;else toast('Kids Mode applies next run');buildMenus()});
$('bShare').addEventListener('click',async()=>{const t='I scored '+score+(kids?' (Kids Mode)':'')+' in Kome Flap! Can you beat me?';
 try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);toast('📋 Score copied')}}
 catch(e){try{await navigator.clipboard.writeText(t);toast('📋 Score copied')}catch(_){}}});
buildMenus();

/* ---------- Loop ---------- */
function loop(){frame++;bird.x=vw/2;
 ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,vw,VH);drawSky();
 if(state===PLAY){playF++;pipes.t++;bird.vy+=bird.g;bird.y+=bird.vy;bird.rot=bird.vy<0?-.38:Math.min(bird.rot+.06,1.2);if(bird.inv>0)bird.inv--;
  pipes.update();
  if(M.lanes){for(const o of lanes){o.x-=1.55;if(o.x<-60){o.x=vw+100+Math.random()*180;o.y=260+Math.random()*180}}
   if(bird.inv<=0){const b=box();for(const o of lanes)if(hit(b,{l:o.x,r:o.x+24,t:o.y,b:o.y+56})){handleHit();break}}}
  if(bird.y+bird.r>=GY){bird.y=GY-bird.r-1;if(kids&&bird.lives>1){bird.vy=bird.jp}handleHit()}
  if(bird.y-bird.r<=0){bird.y=bird.r;bird.vy=0}}
 else if(state===MENU){bird.y=VH/2+Math.sin(frame*.08)*6;bird.rot=0}
 if(M.lanes&&state!==MENU)for(const o of lanes){ctx.fillStyle='#7a4a22';ctx.fillRect(o.x,o.y,24,56);ctx.fillStyle='#b8793b';ctx.fillRect(o.x+4,o.y+4,16,48);ctx.strokeStyle='#4a2a14';ctx.lineWidth=2;ctx.strokeRect(o.x,o.y,24,56)}
 pipes.draw();drawBird(bird.x,bird.y,bird.rot,eff(),bird.inv>0&&frame%8<4?.4:1);
 for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.x+=p.vx;p.y+=p.vy;p.a-=p.d;ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;if(p.a<=0)fx.splice(i,1)}
 drawGround();drawUI();requestAnimationFrame(loop)}
loop();
})();
