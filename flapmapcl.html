<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kome Flap</title>
<style>
  :root{color-scheme:light dark;}
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;
    font-family:'Segoe UI',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;box-shadow:0 0 40px rgba(0,0,0,.6);border-radius:4px;}
  #hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:8px;z-index:5;}
  .btn{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);color:#fff;
    padding:7px 10px;border-radius:14px;font-size:12px;font-weight:600;cursor:pointer;
    backdrop-filter:blur(4px);display:flex;align-items:center;gap:5px;}
  .btn:hover{background:rgba(255,255,255,.2);}
  .btn.active{background:#f7b733;color:#3a2a00;border-color:transparent;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <button class="btn active" data-theme="day">☀️ Ngày</button>
    <button class="btn" data-theme="night">🌙 Đêm</button>
    <button class="btn" data-theme="winter">❄️ Giáng sinh</button>
    <button class="btn" id="skinBtn">🐤 Skin</button>
  </div>
  <canvas id="c"></canvas>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 360, VH = 640;
let scale=1, vw=VW;

function resize(){
  const dpr = window.devicePixelRatio||1;
  const w = innerWidth, h = innerHeight;
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width = Math.floor(w*dpr); cv.height = Math.floor(h*dpr);
  scale = (h*dpr)/VH;
  vw = (w*dpr)/scale;
}
addEventListener('resize', resize); resize();

// ---- Themes ----
const THEMES = {
  day:   { sky:['#4ec0ca','#b4e5e7'], ground:'#ded895', grass:'#73cd30', grass2:'#53a021',
           pipe:['#55a823','#86e33c','#2d6011'], cloud:'rgba(255,255,255,.85)', particle:'#fff', text:'#fff' },
  night: { sky:['#0b1030','#1c2a52'], ground:'#2b2f46', grass:'#3a3f66', grass2:'#242840',
           pipe:['#2f5d7a','#4fa3c9','#173a4d'], cloud:'rgba(255,255,255,.12)', particle:'#cfe8ff', text:'#fff', stars:true },
  winter:{ sky:['#8fb8d8','#e6f2f8'], ground:'#eef4f8', grass:'#ffffff', grass2:'#d7e8f2',
           pipe:['#3a7d5a','#6fbf8f','#1f4a34'], cloud:'rgba(255,255,255,.9)', particle:'#fff', text:'#123', snow:true }
};
let themeKey='day', theme=THEMES.day;
document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-theme]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); themeKey=b.dataset.theme; theme=THEMES[themeKey];
}));

// ---- Skins ----
const SKINS = [
  {name:'Kai',   body:'#f7d154', belly:'#fff', beak:'#e67e22'},
  {name:'Neko',  body:'#9b8cff', belly:'#fff', beak:'#ff6f91'},
  {name:'Luna',  body:'#ff9fb0', belly:'#fff', beak:'#c0392b'},
  {name:'Pipo',  body:'#8fd3ff', belly:'#fff', beak:'#f39c12'},
];
let skinIdx=0;
document.getElementById('skinBtn').addEventListener('click',()=>{ skinIdx=(skinIdx+1)%SKINS.length; });

// ---- Snow / stars particles (ambient) ----
let ambient=[];
function seedAmbient(){
  ambient=[];
  const n = themeKey==='winter'?60: themeKey==='night'?70:0;
  for(let i=0;i<n;i++) ambient.push({x:Math.random()*VW,y:Math.random()*VH,r:Math.random()*2+1,s:Math.random()*0.6+0.2,tw:Math.random()*Math.PI*2});
}
seedAmbient();
let lastThemeSeed = themeKey;

// ---- Game state ----
const STATE = {START:0, PLAY:1, OVER:2};
let state = STATE.START, score=0, best=+localStorage.getItem('komeflap_best')||0, frame=0, groundX=0;

let fx=[];
function burst(x,y,color,n=10){ for(let i=0;i<n;i++) fx.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,r:Math.random()*3+1,a:1,d:Math.random()*.03+.02,color}); }

const bird = {
  x:80, y:VH/2, r:14, vy:0, g:0.38, jump:-6.9, rot:0,
  reset(){ this.y=VH/2; this.vy=0; this.rot=0; },
  flap(){ this.vy=this.jump; burst(this.x-6,this.y+4,'#fff',6); },
  update(){
    this.vy+=this.g; this.y+=this.vy;
    this.rot = this.vy<0 ? -0.38 : Math.min(this.rot+0.06, 1.2);
  },
  draw(){
    const s = SKINS[skinIdx];
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    // wing
    const wy = Math.sin(frame*0.35)*3;
    ctx.fillStyle=s.body; ctx.beginPath(); ctx.ellipse(-6,wy,7,4,Math.PI/4,0,7); ctx.fill();
    // body
    ctx.fillStyle=s.body; ctx.beginPath(); ctx.arc(0,0,this.r,0,7); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=1.5; ctx.stroke();
    // belly
    ctx.fillStyle=s.belly; ctx.beginPath(); ctx.ellipse(-2,4,7,6,0,0,7); ctx.fill();
    // eye
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(6,-5,5.5,0,7); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(7.5,-5,2.3,0,7); ctx.fill();
    // beak
    ctx.fillStyle=s.beak; ctx.beginPath(); ctx.moveTo(9,-2); ctx.lineTo(19,2); ctx.lineTo(9,6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
};

const pipes = {
  list:[], w:54, gap:130, speed:2.2,
  reset(){ this.list=[]; },
  spawn(){
    const minH=50, maxH=VH-120-this.gap-minH;
    const top=Math.floor(Math.random()*(maxH-minH+1))+minH;
    this.list.push({x:Math.max(vw,VW), top, passed:false});
  },
  update(){
    if(frame%95===0) this.spawn();
    for(const p of this.list){
      p.x-=this.speed;
      if(!p.passed && p.x+this.w<bird.x){
        p.passed=true; score++; if(score>best){best=score; localStorage.setItem('komeflap_best',best);}
        burst(bird.x,bird.y,'#f1c40f',10);
      }
      const bb={l:bird.x-bird.r+3,r:bird.x+bird.r-3,t:bird.y-bird.r+3,b:bird.y+bird.r-3};
      const topB={l:p.x,r:p.x+this.w,t:0,b:p.top};
      const botB={l:p.x,r:p.x+this.w,t:p.top+this.gap,b:VH-40};
      if(hit(bb,topB)||hit(bb,botB)) gameOver();
    }
    if(this.list.length && this.list[0].x<-this.w) this.list.shift();
  },
  draw(){ for(const p of this.list){ drawPipe(p.x,0,this.w,p.top,true); drawPipe(p.x,p.top+this.gap,this.w,VH-40-(p.top+this.gap),false); } }
};
function hit(a,b){ return !(a.r<b.l||a.l>b.r||a.b<b.t||a.t>b.b); }

function drawPipe(x,y,w,h,top){
  const [c1,c2,c3]=theme.pipe;
  let g=ctx.createLinearGradient(x,0,x+w,0); g.addColorStop(0,c1); g.addColorStop(.3,c2); g.addColorStop(.7,c1); g.addColorStop(1,c3);
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  const capY = top? y+h-20 : y;
  let cg=ctx.createLinearGradient(x-4,0,x+w+4,0); cg.addColorStop(0,c1); cg.addColorStop(.3,c2); cg.addColorStop(.7,c1); cg.addColorStop(1,c3);
  ctx.fillStyle=cg; ctx.fillRect(x-4,capY,w+8,20);
  if(themeKey==='winter'){ ctx.fillStyle='#fff'; ctx.fillRect(x-4,capY-4,w+8,4); }
}

function drawSky(){
  let g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,theme.sky[0]); g.addColorStop(1,theme.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,vw,VH);
  if(themeKey!==lastThemeSeed){ seedAmbient(); lastThemeSeed=themeKey; }
  for(const p of ambient){
    if(themeKey==='night'){ ctx.globalAlpha=0.5+0.5*Math.sin(frame*0.03+p.tw); ctx.fillStyle=theme.particle; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; }
    else if(themeKey==='winter'){ p.y+=p.s; p.x+=Math.sin(frame*0.02+p.tw)*0.3; if(p.y>VH) p.y=-4;
      ctx.fillStyle=theme.particle; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  }
  ctx.fillStyle=theme.cloud;
  for(let i=-1;i<Math.ceil(vw/250)+1;i++){
    const cx=(i*250)-(frame*0.3)%250;
    ctx.beginPath(); ctx.arc(cx+40,90,22,0,7); ctx.arc(cx+65,80,30,0,7); ctx.arc(cx+90,90,22,0,7); ctx.fill();
  }
}

function drawGround(){
  const h=40, y=VH-h;
  if(state===STATE.PLAY) groundX=(groundX+pipes.speed)%16;
  ctx.fillStyle=theme.ground; ctx.fillRect(0,y,vw,h);
  ctx.fillStyle=theme.grass; ctx.fillRect(0,y,vw,12);
  ctx.fillStyle=theme.grass2; ctx.fillRect(0,y+10,vw,3);
  ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=2;
  for(let x=-groundX;x<vw+16;x+=16){ ctx.beginPath(); ctx.moveTo(x,y+13); ctx.lineTo(x-8,y+h); ctx.stroke(); }
}

function drawUI(){
  const cx=vw/2;
  ctx.textAlign='center';
  if(state===STATE.PLAY){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.font='900 38px sans-serif';
    ctx.strokeText(score,cx,65); ctx.fillText(score,cx,65);
  } else if(state===STATE.START){
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(0,0,vw,VH);
    ctx.fillStyle='#f7d154'; ctx.strokeStyle='#000'; ctx.lineWidth=5; ctx.font='900 34px sans-serif';
    ctx.strokeText('KOME FLAP',cx,160); ctx.fillText('KOME FLAP',cx,160);
    ctx.fillStyle='#fff'; ctx.strokeStyle='#2c3e50'; ctx.lineWidth=3; roundRect(cx-110,270,220,54,12,true,true);
    ctx.fillStyle='#e74c3c'; ctx.font='bold 17px sans-serif'; ctx.fillText('CHẠM ĐỂ BẮT ĐẦU',cx,303);
    ctx.fillStyle='#fff'; ctx.font='13px sans-serif'; ctx.fillText('Kỷ lục: '+best,cx,340);
  } else if(state===STATE.OVER){
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,vw,VH);
    const bw=270,bh=195,bx=cx-bw/2,by=150;
    ctx.fillStyle='#eccc68'; ctx.strokeStyle='#57606f'; ctx.lineWidth=4; roundRect(bx,by,bw,bh,14,true,true);
    ctx.fillStyle='#e74c3c'; ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.font='900 26px sans-serif';
    ctx.strokeText('GAME OVER',cx,by+42); ctx.fillText('GAME OVER',cx,by+42);
    ctx.fillStyle='#2f3542'; ctx.font='bold 16px sans-serif'; ctx.textAlign='left';
    ctx.fillText('Điểm: '+score, bx+35, by+92);
    ctx.fillText('Kỷ lục: '+best, bx+35, by+122);
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.font='bold 16px sans-serif';
    ctx.strokeText('Chạm để chơi lại',cx,by+168); ctx.fillText('Chạm để chơi lại',cx,by+168);
  }
}
function roundRect(x,y,w,h,r,f,s){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  if(f) ctx.fill(); if(s) ctx.stroke();
}

function gameOver(){ state=STATE.OVER; burst(bird.x,bird.y,'#e74c3c',22); }
function start(){
  if(state===STATE.PLAY){ bird.flap(); return; }
  state=STATE.PLAY; bird.reset(); pipes.reset(); score=0; bird.flap();
}

addEventListener('keydown', e=>{ if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); start(); } });
addEventListener('pointerdown', e=>{ if(e.target.closest('#hud')) return; start(); });

function loop(){
  frame++;
  ctx.save(); ctx.scale(scale,scale); ctx.clearRect(0,0,vw,VH);
  drawSky();
  if(state===STATE.PLAY){
    bird.update(); pipes.update();
    if(bird.y+bird.r>=VH-40){ bird.y=VH-40-bird.r; gameOver(); }
    if(bird.y-bird.r<=0){ bird.y=bird.r; bird.vy=0; }
  } else if(state===STATE.START){ bird.y=VH/2+Math.sin(frame*0.08)*6; }
  pipes.draw(); bird.draw();
  for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.x+=p.vx; p.y+=p.vy; p.a-=p.d;
    ctx.globalAlpha=Math.max(0,p.a); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1;
    if(p.a<=0) fx.splice(i,1); }
  drawGround(); drawUI();
  ctx.restore();
  requestAnimationFrame(loop);
}
bird.reset(); loop();
})();
</script>
</body>
</html>
